## Simple recursive caching DNS
## unbound.conf -- https://calomel.org
## https://unbound.docs.nlnetlabs.nl/en/latest/manpages/unbound.conf.html

server:

	chroot:  "/var/unbound"
	logfile: "/var/unbound/test.log"
	use-syslog: no
	verbosity: 1

	do-ip4: yes
	do-ip6: yes
	do-udp: yes
	do-tcp: yes

	# BIND TO ALL INTERFACES
	port: 53
	interface: 0.0.0.0
	interface: ::0

	access-control: ::1                      allow
	access-control: 127.0.0.0/8              allow
	access-control: 10.0.0.0/8               allow
	access-control: fd00::/8                 allow
	access-control: fe80::/10                allow
	access-control: fd00::/16                allow

	private-address: ::1
	private-address: 127.0.0.0/8
	private-address: 10.0.0.0/8
	private-address: fd00::/8
	private-address: fe80::/10
	private-address: fd00::/16

	# other RFC 1918 addrs
	private-address: 172.16.0.0/12
	private-address: 192.168.0.0/16
	private-address: 169.254.0.0/16

	# ipv4-mapped addresses
	private-address: ::ffff:0:0/96

	num-threads:            1
	prefetch:               yes
	prefetch-key:           yes
	rrset-roundrobin:       yes
	hide-identity:          yes
	hide-version:           yes
	harden-glue:            yes
	harden-dnssec-stripped: yes

	cache-min-ttl: 1200
	cache-max-ttl: 14400
	unwanted-reply-threshold: 10000

	# Perform DNSSEC validation.
	root-hints: "/var/unbound/db/root.hints"
	auto-trust-anchor-file: "/var/unbound/db/root.key"
	qname-minimisation: yes

	# Synthesize NXDOMAINs from DNSSEC NSEC chains.
	# https://tools.ietf.org/html/rfc8198
	aggressive-nsec: yes

	# CA Certificates used for forward-tls-upstream (RFC7858) hostname
	# verification.  Since it's outside the chroot it is only loaded at
	# startup and thus cannot be changed via a reload.
	tls-cert-bundle: "/etc/ssl/cert.pem"
	tls-upstream:    yes

	# add `always_null` entries here to DNS-block undesirable hosts

	#local-zone:   "2mdn.net."                always_null
	#local-zone:   "33across.com."            always_null	
	#local-zone:   "3lift.com."               always_null	
	#local-zone:   "ackcdn.net."              always_null	
	#local-zone:   "adblade.com."             always_null	
	#local-zone:   "adform.net."              always_null	
	#local-zone:   "adnxs.com."               always_null	
	#local-zone:   "adsrvr.org."              always_null	
	#local-zone:   "agkn.com."                always_null	
	#local-zone:   "a-mo.net."                always_null	
	#local-zone:   "betrad.com."              always_null	
	#local-zone:   "bfmio.com."               always_null	
	#local-zone:   "bidgear.com."             always_null	
	#local-zone:   "bidswitch.net."           always_null	
	#local-zone:   "bluekai.com."             always_null	
	#local-zone:   "bttrack.com."             always_null	
	#local-zone:   "chocolateplatform.com."   always_null	
	#local-zone:   "crwdcntrl.net."           always_null	
	#local-zone:   "doubleclick.net."         always_null	
	#local-zone:   "doubleverify.com."        always_null	
	#local-zone:   "durationmedia.net."       always_null	
	#local-zone:   "everesttech.net."         always_null	
	#local-zone:   "evidon.com."              always_null	
	#local-zone:   "exelator.com."            always_null	
	#local-zone:   "fastly-insights.com."     always_null	
	#local-zone:   "google-analytics.com."    always_null	
	#local-zone:   "googlesyndication.com."   always_null	
	#local-zone:   "googletagservices.com."   always_null	
	#local-zone:   "hwcdn.net."               always_null	
	#local-zone:   "imrworldwide.com."        always_null	
	#local-zone:   "jsrdn.com."               always_null	
	#local-zone:   "liadm.com."               always_null	
	#local-zone:   "lijit.com."               always_null	
	#local-zone:   "mfadsrvr.com."            always_null	
	#local-zone:   "ntv.io."                  always_null	
	#local-zone:   "openx.net."               always_null	
	#local-zone:   "postrelease.com."         always_null	
	#local-zone:   "pubmatic.com."            always_null	
	#local-zone:   "quantcount.com."          always_null	
	#local-zone:   "quantserve.com."          always_null	
	#local-zone:   "realsrv.com."             always_null	
	#local-zone:   "rkdms.com."               always_null	
	#local-zone:   "rlcdn.com."               always_null	
	#local-zone:   "scorecardresearch.com."   always_null	
	#local-zone:   "servenobid.com."          always_null	
	#local-zone:   "tribalfusion.com."        always_null	
	#local-zone:   "tynt.com."                always_null	
	#local-zone:   "cookieinformation.com"    always_null	
	#local-zone:   "4chan.org."               always_null	
	#local-zone:   "nocookie.net."            always_null	
	#local-zone:   "youtube.com."             always_null	
	#local-zone:   "facebook.com."            always_null
	#local-zone:   "twitter.com."             always_null
	#local-zone:   "x.com."                   always_null

	private-domain: "mydomain.local"
	local-zone: "mydomain.local." static
	local-data: "mydomain.local 10800 IN NS firewall.mydomain.local."

	# MAIN
	# (these are examples of A records for hosts on your LAN)
	local-data: "firewall.mydomain.local.   3600  IN  A  192.168.0.1"
	local-data: "host1.mydomain.local.      3600  IN  A  192.168.0.51"
	local-data: "host2.mydomain.local.      3600  IN  A  192.168.0.52"

# Use an upstream DNS-over-TLS forwarder and do not fall back to cleartext if that fails.
forward-zone:
	name: "."
	forward-tls-upstream: yes   # use DNS-over-TLS forwarder
	forward-first: no           # do NOT send direct

	# !IMPORTANT NOTE!
	# the hostname after "#" is not a comment, it is used for TLS checks:
	forward-addr: 9.9.9.9@853#dns9.quad9.net
	forward-addr: 8.8.8.8@853#dns.google
	forward-addr: 8.8.4.4@853#dns.google
	forward-addr: 2001:4860:4860::8888@853#dns.google
	forward-addr: 2001:4860:4860::8844@853#dns.google

