#
# This file contains a list of sysctl options the user wants set at
# boot time.  See sysctl(3) and sysctl(8) for more information on
# the many available variables.
#

# FORWARDING RULES FOR FIREWALL
net.inet.ip.forwarding=1            # 1=Permit forwarding (routing) of IPv4 packets
net.inet.ip.mforwarding=0           # 1=Permit forwarding (routing) of IPv4 multicast packets
net.inet.ip.redirect=1
net.inet6.ip6.forwarding=1          # 1=Permit forwarding (routing) of IPv6 packets
net.inet6.ip6.mforwarding=0         # 1=Permit forwarding (routing) of IPv6 multicast packets
net.inet6.ip6.redirect=1
net.inet6.ip6.multipath=1
net.inet.tcp.always_keepalive=1     # 1=Keepalives for all connections (e.g. hotel/airport NAT)
net.inet.tcp.keepidle=7200          # Keep alive for 2 hrs (2 * 60 * 60)

# ADJUSTED FROM: http://dant.net.ru/calomel/network_performance.html
net.inet.ip.ifq.maxlen=2048         # Maximum allowed input queue length (256*number of interfaces)
net.inet6.ip6.ifq.maxlen=2048
net.inet.tcp.ackonpush=1            # acks for packets with the push bit set should not be delayed
net.inet.tcp.ecn=1                  # explicit congestion notification enabled
net.inet.tcp.rfc1323=1              # RFC1323 TCP window scaling
net.inet.tcp.sack=1                 # enable TCP Selective ACK (SACK) Packet Recovery
net.inet.udp.recvspace=262144       # increase UDP "receive" windows size to increase performance
net.inet.udp.sendspace=262144       # increase UDP "send" windows size to increase performance
net.inet.ip.ttl=64                  # also needs [ min-ttl 254 in pf scrub rule ]
net.inet.tcp.mssdflt=1440           # maximum segment size (1440 from scrub pf.conf match statement)
kern.bufcachepercent=30             # allow kernel to use up to 30% of RAM for cache

